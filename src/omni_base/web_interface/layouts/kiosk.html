<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Lumi · Kiosk</title>
<link rel="stylesheet" href="../lumi-ui.css"/>
<link rel="stylesheet" href="kiosk.css"/>
<script src="../lib/roslib.min.js"></script>
<script src="../lumi-core.js?v=map2" defer></script>
</head>
<body data-lumi-app="mapCanvas" data-connected="false" data-nav="idle">

<header class="bar">
  <span class="brand"><i class="brand-eyes"></i>Lumi</span>
  <span class="grow"></span>
  <span class="conn"><i class="dot"></i><span data-lumi="conn">Offline</span></span>
  <button class="icon-btn" data-action="fullscreen" aria-label="Toggle fullscreen" title="Fullscreen (F)"><svg class="fs-ico" viewBox="0 0 24 24" aria-hidden="true"><path class="fs-in" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><path class="fs-out" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
  <button class="icon-btn" data-open="drawer" aria-label="Settings" title="Settings">&#9881;</button>
</header>

<main class="main">
  <section class="dest">
    <h2>Where should I go?</h2>
    <p>Tap a place and I will take you there.</p>
    <!-- filled automatically from the robot's known and saved locations -->
    <div class="room-grid" data-lumi="room-buttons"></div>
  </section>

  <aside class="side">
    <div class="map-stage mini-map"><canvas id="mapCanvas"></canvas></div>
    <div class="status-card">
      <div class="navchip" data-lumi="navstate">Idle</div>
      <div class="sub">Position <span data-lumi="px">&mdash;</span>, <span data-lumi="py">&mdash;</span></div>
    </div>
    <div class="hello">
      <span class="eyebrow">Say hello</span>
      <div class="emo-grid" data-lumi="emotion-buttons" data-only="happy,love,wink,excited,surprised,sleepy"></div>
    </div>
    <button class="btn btn-stop btn-lg big-stop" data-action="stop">Stop the robot</button>
  </aside>
</main>

<!-- Staff-only: kept out of the main view -->
<div class="overlay" id="drawer">
  <div class="overlay-box">
    <div class="overlay-head"><h3>Settings</h3><button class="icon-btn" data-close aria-label="Close">&#10005;</button></div>
    <div class="block">
      <span class="eyebrow">Robot connection</span>
      <input type="text" data-lumi="url" placeholder="ws://192.168.1.10:9090" aria-label="rosbridge address" spellcheck="false"/>
      <div class="btn-row">
        <button class="btn btn-primary" data-action="connect">Connect</button>
        <button class="btn btn-danger" data-action="disconnect">Disconnect</button>
        <button class="btn btn-ghost" data-action="fit">Fit map</button>
        <a class="btn btn-ghost" href="index.html?choose">Layouts</a>
      </div>
    </div>
    <div class="block">
      <span class="eyebrow">Manual drive</span>
      <div data-lumi="dpad"></div>
    </div>
  </div>
</div>

<div class="toast" data-lumi="toast"><span data-lumi="toast-msg"></span></div>
<input type="hidden" data-lumi="lin-speed" value="0.18"/>
<input type="hidden" data-lumi="ang-speed" value="0.45"/>
</body>
</html>
