<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Lumi · Immersive</title>
<link rel="stylesheet" href="../lumi-ui.css"/>
<link rel="stylesheet" href="immersive.css"/>
<script src="../lib/roslib.min.js"></script>
<script src="../lumi-core.js" defer></script>
</head>
<body data-lumi-app="mapCanvas" data-connected="false" data-nav="idle">

<div class="world">
  <div class="map-stage"><canvas id="mapCanvas"></canvas></div>
</div>

<header class="hud-top glass">
  <span class="brand"><i class="brand-eyes"></i><span class="bn">Lumi</span></span>
  <span class="sep"></span>
  <span class="conn"><i class="dot"></i><span data-lumi="conn">Offline</span></span>
  <span class="grow"></span>
  <input class="url" type="text" data-lumi="url" placeholder="ws://IP:9090" aria-label="rosbridge address" spellcheck="false"/>
  <button class="btn btn-primary" data-action="connect">Connect</button>
  <button class="btn btn-danger" data-action="disconnect">Disconnect</button>
  <a class="btn btn-ghost" href="index.html?choose">Layouts</a>
</header>

<nav class="hud-rail glass" aria-label="Map tools">
  <div class="seg vertical" data-lumi="mode-buttons"></div>
  <hr/>
  <button class="btn" data-action="fit">Fit map</button>
  <button class="btn" data-action="fullscreen" aria-label="Toggle fullscreen" title="Fullscreen (F)"><svg class="fs-ico" viewBox="0 0 24 24" aria-hidden="true"><path class="fs-in" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><path class="fs-out" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg><span class="lbl">Fullscreen</span></button>
  <hr/>
  <button class="btn btn-danger" data-action="cancel">Cancel</button>
  <button class="btn btn-stop" data-action="stop">Stop</button>
</nav>

<div class="hint glass" data-lumi="hint"></div>

<section class="hud-bottom">
  <div class="panel glass stat"><span class="eyebrow">Status</span><span class="val txt navchip" data-lumi="navstate">Idle</span></div>
  <div class="panel glass stat"><span class="eyebrow">X</span><span class="val" data-lumi="px">&mdash;</span></div>
  <div class="panel glass stat"><span class="eyebrow">Y</span><span class="val" data-lumi="py">&mdash;</span></div>
  <div class="panel glass stat"><span class="eyebrow">Yaw</span><span class="val" data-lumi="pyaw">&mdash;</span></div>
  <div class="panel glass pad"><span class="eyebrow">Drive</span><div data-lumi="dpad" data-variant="row"></div></div>
  <div class="panel glass grow-panel">
    <span class="eyebrow">Destination</span>
    <select data-lumi="rooms" data-autogo aria-label="Destination"></select>
  </div>
  <div class="panel glass grow-panel">
    <span class="eyebrow">Expression</span>
    <div class="emo-grid" data-lumi="emotion-buttons" data-only="happy,neutral,love,excited,wink,sad"></div>
  </div>
</section>

<div class="toast" data-lumi="toast"><span data-lumi="toast-msg"></span></div>
<!-- teleop speeds without sliders -->
<input type="hidden" data-lumi="lin-speed" value="0.20"/>
<input type="hidden" data-lumi="ang-speed" value="0.50"/>
</body>
</html>
