<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Lumi · Split</title>
<link rel="stylesheet" href="../lumi-ui.css"/>
<link rel="stylesheet" href="split.css"/>
<script src="../lib/roslib.min.js"></script>
<script src="../lumi-core.js" defer></script>
</head>
<body data-lumi-app="mapCanvas" data-connected="false" data-nav="idle">

<section class="map-side" aria-label="Map">
  <div class="map-stage">
    <canvas id="mapCanvas"></canvas>
    <div class="map-tools">
      <button class="icon-btn" data-action="zoom-in" aria-label="Zoom in">+</button>
      <button class="icon-btn" data-action="zoom-out" aria-label="Zoom out">&minus;</button>
      <button class="icon-btn txt" data-action="fit" aria-label="Fit map to view">FIT</button>
    </div>
    <div class="map-hint" data-lumi="hint"></div>
  </div>
  <div class="overlay-top">
    <span class="tag">Pos <b data-lumi="px">&mdash;</b>, <b data-lumi="py">&mdash;</b></span>
    <span class="tag"><b data-lumi="navstate">Idle</b></span>
  </div>
</section>

<section class="ctrl-side">
  <div class="ctrl-head">
    <span class="brand"><i class="brand-eyes"></i>Lumi</span>
    <span class="grow"></span>
    <button class="icon-btn" data-action="fullscreen" aria-label="Toggle fullscreen" title="Fullscreen (F)"><svg class="fs-ico" viewBox="0 0 24 24" aria-hidden="true"><path class="fs-in" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><path class="fs-out" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
    <span class="conn"><i class="dot"></i><span data-lumi="conn">Offline</span></span>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" data-tab="go">Go</button>
    <button class="tab" data-tab="drive">Drive</button>
    <button class="tab" data-tab="express">Express</button>
    <button class="tab" data-tab="setup">Setup</button>
  </div>

  <div class="tab-body">

    <div class="pane" data-tabpanel="go">
      <span class="eyebrow">Destinations</span>
      <div class="room-grid" data-lumi="room-buttons"></div>
      <span class="eyebrow">Map mode</span>
      <div class="seg cols-2" data-lumi="mode-buttons"></div>
      <div class="card">
        <div class="row"><span>Goal X</span><b data-lumi="gx">&mdash;</b></div>
        <div class="row"><span>Goal Y</span><b data-lumi="gy">&mdash;</b></div>
        <div class="row"><span>Heading</span><b data-lumi="pyaw">&mdash;</b></div>
      </div>
      <button class="btn btn-danger btn-block" data-action="cancel">Cancel current goal</button>
    </div>

    <div class="pane" data-tabpanel="drive">
      <span class="eyebrow">Manual drive</span>
      <div data-lumi="dpad"></div>
      <div class="card"><div class="pane" data-lumi="speed-controls"></div></div>
      <div class="card"><div class="row"><span>Live velocity</span><b data-lumi="vel">0.00 / 0.00</b></div></div>
    </div>

    <div class="pane" data-tabpanel="express">
      <span class="eyebrow">Eye expression</span>
      <div class="emo-grid" data-lumi="emotion-buttons"></div>
      <span class="eyebrow">Body</span>
      <div class="chip-grid" data-lumi="body-buttons"></div>
      <div class="card">
        <div class="row"><span>Eyes showing</span><b data-lumi="emotion">&mdash;</b></div>
        <div class="row"><span>Last heard</span><b data-lumi="voice">&mdash;</b></div>
      </div>
    </div>

    <div class="pane" data-tabpanel="setup">
      <span class="eyebrow">Rosbridge</span>
      <input type="text" data-lumi="url" placeholder="ws://192.168.1.10:9090" aria-label="rosbridge address" spellcheck="false"/>
      <div class="btn-row">
        <button class="btn btn-primary" data-action="connect">Connect</button>
        <button class="btn btn-danger" data-action="disconnect">Disconnect</button>
        <a class="btn btn-ghost" href="index.html?choose">Layouts</a>
      </div>
      <span class="eyebrow">Topic health</span>
      <div class="card">
        <div class="row"><span>/scan</span><b data-lumi="scan">&mdash;</b></div>
        <div class="row"><span>/map</span><b data-lumi="mapstat">&mdash;</b></div>
        <div class="row"><span>/amcl_pose</span><b data-lumi="amcl">&mdash;</b></div>
        <div class="row"><span>Map size</span><b data-lumi="mapsize">&mdash;</b></div>
        <div class="row"><span>Destinations</span><b data-lumi="roomcount">0</b></div>
      </div>
      <span class="eyebrow">Log</span>
      <div class="log" data-lumi="log"></div>
    </div>

  </div>

  <div class="stop-bar">
    <button class="btn btn-stop btn-lg btn-block" data-action="stop">Emergency stop</button>
  </div>
</section>

<div class="toast" data-lumi="toast"><span data-lumi="toast-msg"></span></div>
</body>
</html>
