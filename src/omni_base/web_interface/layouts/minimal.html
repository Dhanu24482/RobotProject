<!DOCTYPE html>
<html lang="en" data-theme="oled">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<title>Lumi · Minimal</title>
<link rel="stylesheet" href="../lumi-ui.css"/>
<link rel="stylesheet" href="minimal.css"/>
<script src="../lib/roslib.min.js"></script>
<script src="../lumi-core.js" defer></script>
</head>
<body data-lumi-app="mapCanvas" data-connected="false" data-nav="idle">

<main class="map">
  <div class="map-stage">
    <canvas id="mapCanvas"></canvas>
    <div class="map-tools">
      <button class="icon-btn" data-action="zoom-in" aria-label="Zoom in">+</button>
      <button class="icon-btn" data-action="zoom-out" aria-label="Zoom out">&minus;</button>
      <button class="icon-btn txt" data-action="fit" aria-label="Fit map to view">FIT</button>
    </div>
    <div class="map-hint" data-lumi="hint"></div>
  </div>
  <div class="status">
    <i class="dot"></i>
    <span data-lumi="navstate">Idle</span>
    <span class="pos"><span data-lumi="px">&mdash;</span>, <span data-lumi="py">&mdash;</span></span>
  </div>
</main>

<footer class="bar">
  <select data-lumi="rooms" data-autogo aria-label="Destination"></select>
  <div data-lumi="dpad" data-variant="row"></div>
  <div class="emo-grid" data-lumi="emotion-buttons" data-only="happy,neutral,love,wink"></div>
  <span class="grow"></span>
  <span class="mini">Speed<b data-lumi="vel">0.00 / 0.00</b></span>
  <span class="mini">Zoom<b data-lumi="zoom">1.0x</b></span>
  <button class="icon-btn" data-action="fullscreen" aria-label="Toggle fullscreen" title="Fullscreen (F)"><svg class="fs-ico" viewBox="0 0 24 24" aria-hidden="true"><path class="fs-in" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><path class="fs-out" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
  <button class="icon-btn" data-open="sheet" aria-label="Settings" title="Settings">&#9881;</button>
  <button class="btn btn-stop stop-sq" data-action="stop" aria-label="Stop" title="Stop">&#9632;</button>
</footer>

<div class="overlay" id="sheet">
  <div class="overlay-box">
    <div class="overlay-head"><h3>Settings</h3><button class="icon-btn" data-close aria-label="Close">&#10005;</button></div>
    <div class="block">
      <span class="eyebrow">Connection</span>
      <input type="text" data-lumi="url" placeholder="ws://192.168.1.10:9090" aria-label="rosbridge address" spellcheck="false"/>
      <div class="btn-row">
        <button class="btn btn-primary" data-action="connect">Connect</button>
        <button class="btn btn-danger" data-action="disconnect">Disconnect</button>
        <button class="btn btn-danger" data-action="cancel">Cancel goal</button>
        <a class="btn btn-ghost" href="index.html?choose">Layouts</a>
      </div>
    </div>
    <div class="block">
      <span class="eyebrow">Map mode</span>
      <div class="seg cols-2" data-lumi="mode-buttons"></div>
    </div>
  </div>
</div>

<div class="toast" data-lumi="toast"><span data-lumi="toast-msg"></span></div>
<input type="hidden" data-lumi="lin-speed" value="0.20"/>
<input type="hidden" data-lumi="ang-speed" value="0.50"/>
</body>
</html>
