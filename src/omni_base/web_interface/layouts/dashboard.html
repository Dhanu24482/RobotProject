<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="color-scheme" content="dark light"/>
<title>Lumi · Dashboard</title>
<link rel="stylesheet" href="../lumi-ui.css"/>
<link rel="stylesheet" href="dashboard.css"/>
<script src="../lib/roslib.min.js"></script>
<script src="../lumi-core.js?v=map2" defer></script>
</head>
<body data-lumi-app="mapCanvas" data-connected="false" data-nav="idle">

<header class="topbar">
  <span class="brand"><i class="brand-eyes"></i>Lumi <small>Dashboard</small></span>
  <span class="conn"><i class="dot"></i><span data-lumi="conn">Offline</span></span>
  <span class="grow"></span>
  <input class="url" type="text" data-lumi="url" placeholder="ws://PI_IP:9090" aria-label="rosbridge address" spellcheck="false"/>
  <button class="btn btn-primary" data-action="connect">Connect</button>
  <button class="btn btn-danger" data-action="disconnect">Disconnect</button>
  <button class="icon-btn" data-action="fullscreen" aria-label="Toggle fullscreen" title="Fullscreen (F)"><svg class="fs-ico" viewBox="0 0 24 24" aria-hidden="true"><path class="fs-in" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><path class="fs-out" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
  <button class="btn btn-stop" data-action="stop">Stop</button>
</header>

<main class="grid">

  <section class="card map a-map" aria-label="Map">
    <div class="map-stage">
      <canvas id="mapCanvas"></canvas>
      <div class="map-tools">
        <button class="icon-btn" data-action="zoom-in" aria-label="Zoom in">+</button>
        <button class="icon-btn" data-action="zoom-out" aria-label="Zoom out">&minus;</button>
        <button class="icon-btn txt" data-action="fit" aria-label="Fit map to view">FIT</button>
      </div>
      <div class="map-hint" data-lumi="hint"></div>
    </div>
  </section>

  <section class="card a-nav">
    <h3 class="card-title eyebrow">Navigation</h3>
    <div class="navchip mb-12" data-lumi="navstate">Idle</div>
    <div class="row"><span>Goal X</span><b data-lumi="gx">&mdash;</b></div>
    <div class="row"><span>Goal Y</span><b data-lumi="gy">&mdash;</b></div>
    <div class="row"><span>Destinations</span><b data-lumi="roomcount">0</b></div>
    <button class="btn btn-danger btn-block mt-12" data-action="cancel">Cancel goal</button>
  </section>

  <section class="card a-pose">
    <h3 class="card-title eyebrow">Robot pose</h3>
    <div class="pose-pair">
      <div class="metric"><span class="num" data-lumi="px">&mdash;</span><span class="unit">x</span></div>
      <div class="metric"><span class="num" data-lumi="py">&mdash;</span><span class="unit">y</span></div>
    </div>
    <div class="row"><span>Heading</span><b data-lumi="pyaw">&mdash;</b></div>
    <div class="row"><span>Velocity</span><b data-lumi="vel">0.00 / 0.00</b></div>
  </section>

  <section class="card a-dest">
    <h3 class="card-title eyebrow">Destinations</h3>
    <div class="room-grid" data-lumi="room-buttons"></div>
  </section>

  <section class="card a-modes">
    <h3 class="card-title eyebrow">Map mode</h3>
    <div class="seg cols-2" data-lumi="mode-buttons"></div>
    <h3 class="subhead eyebrow">Quick select</h3>
    <select data-lumi="rooms" data-autogo aria-label="Go to destination"></select>
  </section>

  <section class="card a-drive">
    <h3 class="card-title eyebrow">Manual drive</h3>
    <div class="stack">
      <div data-lumi="dpad"></div>
      <div class="stack" data-lumi="speed-controls"></div>
    </div>
  </section>

  <section class="card a-expr">
    <h3 class="card-title eyebrow">Expression &amp; body</h3>
    <div class="emo-grid" data-lumi="emotion-buttons"></div>
    <div class="row mt-12"><span>Eyes showing</span><b data-lumi="emotion">&mdash;</b></div>
    <h3 class="subhead eyebrow">Body</h3>
    <div class="chip-grid" data-lumi="body-buttons"></div>
  </section>

  <section class="card a-health">
    <h3 class="card-title eyebrow">System health</h3>
    <div class="row"><span>/scan</span><b data-lumi="scan">&mdash;</b></div>
    <div class="row"><span>/map</span><b data-lumi="mapstat">&mdash;</b></div>
    <div class="row"><span>/amcl_pose</span><b data-lumi="amcl">&mdash;</b></div>
    <div class="row"><span>Map size</span><b data-lumi="mapsize">&mdash;</b></div>
    <div class="row"><span>Last heard</span><b data-lumi="voice">&mdash;</b></div>
  </section>

  <section class="card a-log">
    <h3 class="card-title eyebrow">Activity</h3>
    <div class="log" data-lumi="log"></div>
  </section>

</main>

<div class="toast" data-lumi="toast"><span data-lumi="toast-msg"></span></div>
</body>
</html>
