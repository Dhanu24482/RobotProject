ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # --- Sensor 1: Wheel Encoders ---
    odom0: wheel/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,  # Use X velocity
                   false, false, true,   # Use Yaw velocity
                   false, false, false]

    # --- Sensor 2: Laser Odometry ---
    odom1: laser/odom
    odom1_config: [true,  true,  false,  # Use X, Y position
                   false, false, true,   # Use Yaw position
                   true,  true,  false,  # Use X, Y velocity
                   false, false, true,   # Use Yaw velocity
                   false, false, false]
