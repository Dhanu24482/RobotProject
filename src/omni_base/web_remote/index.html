<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#070b13">
  <meta name="robots" content="noindex,nofollow">
  <title>Lumi voice</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="toasts" aria-live="polite"></div>
  <header>
    <span class="title"><i class="brand-eyes"></i>Lumi</span>
    <div class="tools">
      <select id="lang" title="Speech language" aria-label="Speech language">
        <option value="en-US">English (US)</option>
        <option value="en-GB">English (UK)</option>
        <option value="en-IN">English (India)</option>
        <option value="en-LK">English (Sri Lanka)</option>
      </select>
      <button id="fs" class="fs-btn" type="button" aria-label="Toggle fullscreen" title="Fullscreen (F)"><svg class="fs-ico" viewBox="0 0 24 24" aria-hidden="true"><path class="fs-in" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><path class="fs-out" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
    </div>
  </header>
  <main>
    <button id="talk" type="button" data-state="idle" aria-pressed="false" aria-label="Hold to speak">
      <span class="ring"></span>
      <svg class="mic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5V6a3.5 3.5 0 0 0-7 0v5.5A3.5 3.5 0 0 0 12 15zm6-3.5a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.92V20H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.58A6 6 0 0 0 18 11.5z"/></svg>
      <span id="label">Hold to speak</span>
    </button>
    <p id="caption" class="caption" aria-live="polite"></p>
    <p class="hint">Hold the button or the <kbd>Space</kbd> bar, speak, then let go.<br>
      Try &ldquo;go to room 1&rdquo;, &ldquo;turn left&rdquo;, &ldquo;wave&rdquo;. Start a question with &ldquo;Hey Lumi&rdquo;.</p>
  </main>
  <button id="stop" class="stop" type="button" title="Stop all motion (Esc)">STOP</button>
  <script src="app.js"></script>
</body>
</html>
